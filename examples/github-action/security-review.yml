# Copy to .github/workflows/security-review.yml in your app's repo.
# Fails the pull request when a critical or high finding appears.
name: Security review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y github:blitzhash360-web/blitzhash-security-review . --out SECURITY-REVIEW.md --fail-on high
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review
          path: SECURITY-REVIEW.md
